[project]
name = "repo-scout"
version = "0.1.0"
description = "Поиск готовых решений на GitHub: стоп-правила, флаги, баллы"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.9.0",
    "nicegui>=3.15,<4",
    "numpy>=2.4.6",
]

[project.scripts]
repo-scout = "repo_scout.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["repo_scout"]
# шрифт лежит в пакете (repo_scout/gui/kit/assets), hatch включает его вместе с пакетом

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
