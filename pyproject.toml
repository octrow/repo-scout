[project]
name = "repo-scout"
version = "0.1.7"
description = "Find GitHub repos you can build on before writing your own: search, triage, local semantic ranking. LLM optional"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "emoji>=2.16.0",
    "fastembed>=0.9.0",
    "nicegui>=3.15,<4",
    "numpy>=2.4.6",
]

[project.scripts]
repo-scout = "repo_scout.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["repo_scout"]
# шрифт лежит в пакете (repo_scout/gui/kit/assets), hatch включает его вместе с пакетом

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.sdist]
# frozen GitHub responses for offline eval (~30 MB) and README images; they live in git, not in the package.
# "/assets" is the root folder only: the GUI fonts in repo_scout/gui/kit/assets must stay
exclude = ["eval/snapshots", "eval/snapshots-llm", "eval/fake-stars/snapshots", "/assets"]

[tool.ruff]
extend-exclude = [".agents", ".claude", "external_examples"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]  # ruff's long-standing defaults; newer ruff versions widen the default set

[project.urls]
Homepage = "https://github.com/octrow/repo-scout"
Issues = "https://github.com/octrow/repo-scout/issues"
