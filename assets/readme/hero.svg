<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">repo-scout</title>
  <desc id="desc">repo-scout finds a GitHub repo you can build on before you write your own. Real run: 282 candidates, 87 dropped by stop rules (dead, noise, toy), 76 dropped as off-topic below closeness 0.64, 119 kept and ranked by closeness.</desc>
