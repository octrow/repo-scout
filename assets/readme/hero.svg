    <text x="52" y="170" font-size="76" font-weight="700" letter-spacing="-2">repo-scout</text>
    <text x="56" y="228" font-size="28">Find the repo you can build on</text>
    <text x="56" y="266" font-size="28">before you write your own.</text>
    <text x="56" y="336" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#6b6f76">search → stop rules → flags → rank by closeness</text>
