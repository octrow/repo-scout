<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="652" viewBox="0 0 1200 652" role="img" aria-labelledby="title desc">
  <title id="title">Triage table from a real run</title>
  <desc id="desc">Rows from one real repo-scout run looking for README-audit tools. Small fresh repos rank first by closeness; flags mark new repos, star bursts and cosmetic-only commits without dropping them. Stop rules drop a dead 79,824-star repo, an awesome list and a toy, and an off-topic repo below closeness 0.64.</desc>
