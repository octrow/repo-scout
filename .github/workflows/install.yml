name: install
on:
  push:
    branches: [main]
    paths: [install.sh, install.ps1, pyproject.toml, uv.lock, "repo_scout/**", .github/workflows/install.yml]
  pull_request:
    paths: [install.sh, install.ps1, pyproject.toml, uv.lock, "repo_scout/**", .github/workflows/install.yml]
  workflow_dispatch:
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      REPO_SCOUT_SOURCE: ${{ github.workspace }}  # install this commit, not what is on GitHub
      REPO_SCOUT_NO_LAUNCH: "1"
      GH_TOKEN: ${{ github.token }}  # so `gh auth status` and doctor pass
    steps:
      - uses: actions/checkout@v4
      - if: runner.os != 'Windows'
        run: |
          sh install.sh --no-launch
          ~/.local/bin/repo-scout --help
          ~/.local/bin/repo-scout doctor
      - if: runner.os == 'Windows'
        shell: powershell  # Windows PowerShell 5.1, what the README one-liner runs
        run: |
          ./install.ps1
          $bin = Join-Path (uv tool dir --bin) "repo-scout.exe"
          & $bin --help; if ($LASTEXITCODE -ne 0) { exit 1 }
          & $bin doctor; if ($LASTEXITCODE -ne 0) { exit 1 }
