name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: tag must match pyproject version (the installer derives the wheel name from the tag)
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"
      - run: uv sync --locked && uv run pytest -q
      - run: uv build
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
