name: release
on:
  push:
    tags: ["v*"]
    branches: [main]  # build-only dry run when the packaging changes; publishing needs a tag
    paths: [.github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: tag must match pyproject version (the installer derives the wheel name from the tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"
      - run: uv sync --locked && uv run pytest -q

  # standalone builds: unpack and run, no Python or uv needed (gh is still required for searches)
  binaries:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, platform: linux-x86_64}  # oldest supported glibc for the widest Linux reach
          - {os: ubuntu-22.04-arm, platform: linux-arm64}
          - {os: macos-latest, platform: macos-arm64}
          - {os: windows-latest, platform: windows-x86_64}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}  # lets the smoke test's doctor pass the gh login check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: build
        run: |
          uv run --locked --python 3.12 --with "pyinstaller>=6.10,<7" pyinstaller --noconfirm --name repo-scout \
            --collect-all nicegui --collect-all fastembed --collect-all onnxruntime \
            --collect-data repo_scout --copy-metadata nicegui repo_scout/__main__.py
      - name: smoke test (also downloads the model through the frozen fastembed)
        run: |
          dist/repo-scout/repo-scout --help
          dist/repo-scout/repo-scout doctor --fix
      - name: archive
        run: |
          name="repo-scout-$(uv version --short)-${{ matrix.platform }}"
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then 7z a -tzip "../$name.zip" repo-scout; else tar -czf "../$name.tar.gz" repo-scout; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform }}
          path: repo-scout-*.*

  release:
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
