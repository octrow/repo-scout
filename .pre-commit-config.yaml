repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1             # same as the ruff dev dependency
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run ty check   # the project's env, so imports resolve; version pinned in pyproject
        language: system
        types: [python]
        pass_filenames: false
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks          # staged changes only; CI (security.yml) scans the whole history
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor            # workflow security: template injection, unpinned actions, pull_request_target
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint        # workflow syntax and shellcheck of run: steps
