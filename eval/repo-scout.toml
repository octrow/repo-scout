name = "repo-scout"
source = "~/dev/repo-scout/docs/analogs/README.md"
need = "Хочу инструмент для поиска на GitHub готовых решений перед тем, как писать своё: чтобы находил не только популярные, но и свежие проекты с малым числом звёзд. Ищу существующие наработки по поиску и ранжированию репозиториев, фильтрации мусора и похожести проектов."
analysis_date = "2026-10-11"
task = "Find GitHub repo-discovery tools to reuse: semantic/vector search over GitHub repositories, hidden-gems finders for low-star projects, ranking by recent activity, noise filtering and README cleaning, without relying on an LLM."
alt_task = "Existing GitHub tools for discovering repositories: semantic embedding search over repos, finding hidden gems with few stars, ranking and filtering candidates, to reuse instead of building our own."
queries = ["github repository discovery semantic search", "find hidden gem github repositories", "github repo search embeddings", "github repository ranking activity score", "similar github repositories recommender", "github search multi-query ranking"]
lang = ""
must = []
exclude = []

[[expected]]
repo = "danielrltan/repohunt"
verdict = "→ Разбор (ранжирование мульти-запросов, чистка README)"
note = "docs/analogs/README.md: Сводка, «триаж: → Разбор»"

[[expected]]
repo = "JoanAbad82/github-hidden-gems"
verdict = "→ Разбор (фильтр шума, активность без бот-коммитов)"
note = "docs/analogs/README.md: Сводка, «триаж: → Разбор (фильтр шума)»"

